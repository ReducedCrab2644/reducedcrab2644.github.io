<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>World Explorer</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    --bg: #080c16;
    --panel: #111827;
    --panel2: #182235;
    --border: #29364d;
    --text: #f4f7ff;
    --muted: #9aa8bd;
    --accent: #638cff;
    --accent2: #805cff;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    color: var(--text);

    background:
        radial-gradient(
            circle at 15% 10%,
            #172653 0,
            transparent 35%
        ),
        radial-gradient(
            circle at 85% 90%,
            #281747 0,
            transparent 35%
        ),
        var(--bg);
}

/* ================= HEADER ================= */

header {
    height: 72px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 30px;

    border-bottom: 1px solid var(--border);

    background: rgba(8, 12, 22, .88);

    backdrop-filter: blur(15px);

    position: sticky;
    top: 0;
    z-index: 100;
}

.logo {
    display: flex;
    align-items: center;
    gap: 12px;

    font-size: 21px;
    font-weight: bold;
}

.logoIcon {
    width: 40px;
    height: 40px;

    border-radius: 50%;

    display: grid;
    place-items: center;

    background:
        linear-gradient(
            135deg,
            var(--accent),
            var(--accent2)
        );

    font-size: 21px;
}

.language {
    background: var(--panel);

    color: white;

    border: 1px solid var(--border);

    border-radius: 9px;

    padding: 9px 12px;

    outline: none;

    cursor: pointer;
}

/* ================= MAIN ================= */

main {
    width: min(1450px, 94%);

    margin: auto;

    padding: 30px 0 50px;
}

.hero {
    text-align: center;

    margin-bottom: 28px;
}

.hero h1 {
    margin: 0;

    font-size: clamp(34px, 5vw, 58px);

    background:
        linear-gradient(
            90deg,
            white,
            #8ba9ff
        );

    -webkit-background-clip: text;
    color: transparent;
}

.hero p {
    color: var(--muted);

    font-size: 17px;
}

/* ================= SEARCH ================= */

.controls {
    display: flex;

    gap: 10px;

    max-width: 800px;

    margin: auto;

    margin-bottom: 24px;
}

.search {
    flex: 1;

    height: 48px;

    background: var(--panel);

    color: white;

    border: 1px solid var(--border);

    border-radius: 11px;

    padding: 0 15px;

    outline: none;

    font-size: 15px;
}

.search:focus {
    border-color: var(--accent);
}

.random {
    height: 48px;

    padding: 0 18px;

    border: 0;

    border-radius: 11px;

    color: white;

    font-weight: bold;

    cursor: pointer;

    background:
        linear-gradient(
            135deg,
            var(--accent),
            var(--accent2)
        );

    transition: .15s;
}

.random:hover {
    transform: translateY(-2px);
}

/* ================= LAYOUT ================= */

.layout {
    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        380px;

    gap: 20px;
}

/* ================= MAP ================= */

.map-card,
.info-card {
    background:
        rgba(17, 24, 39, .9);

    border: 1px solid var(--border);

    border-radius: 18px;

    overflow: hidden;
}

.map-header {
    padding: 16px 20px;

    color: var(--muted);

    border-bottom: 1px solid var(--border);
}

#map {
    height: 610px;

    position: relative;

    overflow: hidden;

    background:
        radial-gradient(
            circle at center,
            #17294d,
            #09111f 75%
        );
}

.map-grid {
    position: absolute;

    inset: 0;

    opacity: .12;

    background-image:
        linear-gradient(
            #8ca2c9 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            #8ca2c9 1px,
            transparent 1px
        );

    background-size: 50px 50px;
}

#worldMap {
    width: 100%;
    height: 100%;

    position: relative;
    z-index: 2;
}

.country {
    fill: #34486a;

    stroke: #16233a;

    stroke-width: .7;

    cursor: pointer;

    transition:
        fill .15s,
        filter .15s;
}

.country:hover {
    fill: #7398ff;

    filter:
        drop-shadow(
            0 0 5px
            rgba(100,140,255,.5)
        );
}

.country.selected {
    fill: #805cff;

    stroke: white;

    stroke-width: 1.5;
}

/* ================= INFO ================= */

.info-card {
    min-height: 610px;
}

.empty {
    min-height: 610px;

    display: grid;

    place-items: center;

    text-align: center;

    padding: 30px;

    color: var(--muted);
}

.emptyIcon {
    font-size: 70px;
}

.countryTop {
    padding: 24px;

    background:
        linear-gradient(
            135deg,
            rgba(99,140,255,.17),
            transparent
        ),
        var(--panel);

    border-bottom: 1px solid var(--border);
}

.flag {
    width: 100%;
    height: 175px;

    object-fit: cover;

    border-radius: 12px;

    border: 1px solid var(--border);

    background: #080c16;
}

.countryName {
    margin: 17px 0 5px;

    font-size: 28px;
}

.official {
    color: var(--muted);

    font-size: 13px;

    line-height: 1.5;
}

.stats {
    padding: 20px;

    display: grid;

    gap: 10px;
}

.stat {
    display: flex;

    gap: 12px;

    padding: 13px;

    border-radius: 11px;

    border: 1px solid var(--border);

    background:
        rgba(255,255,255,.025);
}

.statIcon {
    width: 36px;
    height: 36px;

    flex-shrink: 0;

    display: grid;

    place-items: center;

    border-radius: 9px;

    background: #202d49;
}

.statLabel {
    color: var(--muted);

    font-size: 12px;

    margin-bottom: 4px;
}

.statValue {
    font-size: 15px;

    word-break: break-word;

    line-height: 1.4;
}

/* ================= COUNTRY LIST ================= */

.results {
    margin-top: 22px;
}

.resultsTitle {
    color: var(--muted);

    margin-bottom: 12px;
}

.countryList {
    display: grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(180px, 1fr)
        );

    gap: 9px;
}

.countryItem {
    display: flex;

    align-items: center;

    gap: 9px;

    padding: 9px;

    background: var(--panel);

    border: 1px solid var(--border);

    border-radius: 10px;

    cursor: pointer;

    transition: .15s;
}

.countryItem:hover {
    border-color: var(--accent);

    transform: translateY(-2px);
}

.countryItem img {
    width: 38px;
    height: 25px;

    object-fit: cover;

    border-radius: 4px;

    flex-shrink: 0;
}

.loading {
    padding: 40px;

    color: var(--muted);

    text-align: center;
}

.error {
    padding: 40px;

    color: #ff8585;

    text-align: center;
}

/* ================= MOBILE ================= */

@media (max-width: 1000px) {

    .layout {
        grid-template-columns: 1fr;
    }

    #map {
        height: 500px;
    }

    .info-card {
        min-height: auto;
    }
}

@media (max-width: 600px) {

    header {
        padding: 0 14px;
    }

    .logo {
        font-size: 17px;
    }

    .controls {
        flex-direction: column;
    }

    .random {
        width: 100%;
    }

    #map {
        height: 350px;
    }

    .flag {
        height: 140px;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">

        <div class="logoIcon">
            🌍
        </div>

        <span id="siteName">
            World Explorer
        </span>

    </div>

    <select
        id="language"
        class="language"
    >
        <option value="en">
            🇺🇸 English
        </option>

        <option value="pt">
            🇧🇷 Português
        </option>

        <option value="es">
            🇪🇸 Español
        </option>
    </select>

</header>


<main>

    <section class="hero">

        <h1 id="title">
            Explore the World
        </h1>

        <p id="subtitle">
            Discover countries, cultures and geographic information.
        </p>

    </section>


    <div class="controls">

        <input
            id="search"
            class="search"
            type="text"
            autocomplete="off"
            placeholder="Search for a country..."
        >

        <button
            id="random"
            class="random"
        >
            🎲 Random country
        </button>

    </div>


    <section class="layout">

        <div class="map-card">

            <div
                id="mapHeader"
                class="map-header"
            >
                🌐 Select a country on the map
            </div>

            <div id="map">

                <div class="map-grid"></div>

                <svg
                    id="worldMap"
                    viewBox="0 0 1000 500"
                    preserveAspectRatio="xMidYMid meet">
                </svg>

            </div>

        </div>


        <aside
            id="info"
            class="info-card"
        >

            <div class="empty">

                <div>

                    <div class="emptyIcon">
                        🌎
                    </div>

                    <h2 id="emptyTitle">
                        Choose a country
                    </h2>

                    <p id="emptyText">
                        Click on a country on the map or search for one.
                    </p>

                </div>

            </div>

        </aside>

    </section>


    <section class="results">

        <div
            id="resultsTitle"
            class="resultsTitle"
        >
            Countries
        </div>

        <div
            id="countryList"
            class="countryList"
        ></div>

    </section>

</main>


<script>

/* =====================================================
   TRADUÇÕES
===================================================== */

const translations = {

    en: {
        siteName: "World Explorer",
        title: "Explore the World",
        subtitle:
            "Discover countries, cultures and geographic information.",
        search: "Search for a country...",
        random: "🎲 Random country",
        mapHeader:
            "🌐 Select a country on the map",
        emptyTitle:
            "Choose a country",
        emptyText:
            "Click on a country on the map or search for one.",
        countries: "Countries",
        population: "Population",
        capital: "Capital",
        languages: "Languages",
        currency: "Currency",
        official: "Official name",
        loading: "Loading countries...",
        error: "Unable to load country data.",
        unknown: "Unknown"
    },

    pt: {
        siteName: "World Explorer",
        title: "Explore o Mundo",
        subtitle:
            "Descubra países, culturas e informações geográficas.",
        search: "Pesquise um país...",
        random: "🎲 País aleatório",
        mapHeader:
            "🌐 Selecione um país no mapa",
        emptyTitle:
            "Escolha um país",
        emptyText:
            "Clique em um país no mapa ou pesquise por um.",
        countries: "Países",
        population: "População",
        capital: "Capital",
        languages: "Idiomas",
        currency: "Moeda",
        official: "Nome oficial",
        loading: "Carregando países...",
        error:
            "Não foi possível carregar os dados dos países.",
        unknown: "Desconhecido"
    },

    es: {
        siteName: "World Explorer",
        title: "Explora el Mundo",
        subtitle:
            "Descubre países, culturas e información geográfica.",
        search: "Busca un país...",
        random: "🎲 País aleatorio",
        mapHeader:
            "🌐 Selecciona un país en el mapa",
        emptyTitle:
            "Elige un país",
        emptyText:
            "Haz clic en un país en el mapa o busca uno.",
        countries: "Países",
        population: "Población",
        capital: "Capital",
        languages: "Idiomas",
        currency: "Moneda",
        official: "Nombre oficial",
        loading: "Cargando países...",
        error:
            "No se pudieron cargar los datos de los países.",
        unknown: "Desconocido"
    }

};


/* =====================================================
   IDIOMA
===================================================== */

function detectLanguage() {

    const lang =
        navigator.language.toLowerCase();

    if (lang.startsWith("pt")) {
        return "pt";
    }

    if (lang.startsWith("es")) {
        return "es";
    }

    if (lang.startsWith("en")) {
        return "en";
    }

    return "en";
}


let currentLanguage =
    detectLanguage();


function applyLanguage() {

    const t =
        translations[currentLanguage];

    document.documentElement.lang =
        currentLanguage;

    document.title =
        t.siteName;

    document.getElementById(
        "siteName"
    ).textContent =
        t.siteName;

    document.getElementById(
        "title"
    ).textContent =
        t.title;

    document.getElementById(
        "subtitle"
    ).textContent =
        t.subtitle;

    document.getElementById(
        "search"
    ).placeholder =
        t.search;

    document.getElementById(
        "random"
    ).textContent =
        t.random;

    document.getElementById(
        "mapHeader"
    ).textContent =
        t.mapHeader;

    document.getElementById(
        "emptyTitle"
    ).textContent =
        t.emptyTitle;

    document.getElementById(
        "emptyText"
    ).textContent =
        t.emptyText;

    document.getElementById(
        "resultsTitle"
    ).textContent =
        t.countries;

    document.getElementById(
        "language"
    ).value =
        currentLanguage;
}


/* =====================================================
   DADOS
===================================================== */

let countries = [];

let selectedCountry = null;


/*
    IMPORTANTE:
    Agora incluímos ccn3.
*/

async function loadCountries() {

    const list =
        document.getElementById(
            "countryList"
        );

    list.innerHTML = `
        <div class="loading">
            ${translations[currentLanguage].loading}
        </div>
    `;

    try {

        const response =
            await fetch(
                "https://restcountries.com/v3.1/all?fields=name,cca3,ccn3,cca2,capital,population,languages,currencies,flags,translations"
            );

        if (!response.ok) {
            throw new Error(
                "HTTP " + response.status
            );
        }

        countries =
            await response.json();

        countries =
            countries.filter(
                country =>
                    country.cca3 &&
                    country.ccn3
            );

        countries.sort(
            (a, b) =>
                getCountryName(a)
                    .localeCompare(
                        getCountryName(b)
                    )
        );

        renderCountryList(
            countries
        );

        await loadMap();

    } catch (error) {

        console.error(error);

        list.innerHTML = `
            <div class="error">
                ${translations[currentLanguage].error}
            </div>
        `;
    }
}


/* =====================================================
   NOME DO PAÍS
===================================================== */

function getCountryName(country) {

    if (!country) {
        return "";
    }

    if (
        currentLanguage === "pt" &&
        country.translations?.por?.common
    ) {
        return country.translations.por.common;
    }

    if (
        currentLanguage === "es" &&
        country.translations?.spa?.common
    ) {
        return country.translations.spa.common;
    }

    return country.name?.common || "";
}


/* =====================================================
   LISTA
===================================================== */

function renderCountryList(data) {

    const list =
        document.getElementById(
            "countryList"
        );

    list.innerHTML = "";

    data.forEach(country => {

        const item =
            document.createElement(
                "div"
            );

        item.className =
            "countryItem";

        const flag =
            country.flags?.svg ||
            country.flags?.png ||
            "";

        item.innerHTML = `

            <img
                src="${flag}"
                alt=""
                loading="lazy"
            >

            <span>
                ${escapeHTML(
                    getCountryName(country)
                )}
            </span>

        `;

        item.addEventListener(
            "click",
            () => showCountry(country)
        );

        list.appendChild(item);
    });
}


/* =====================================================
   SEGURANÇA HTML
===================================================== */

function escapeHTML(text) {

    return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


/* =====================================================
   PESQUISA
===================================================== */

document
    .getElementById("search")
    .addEventListener(
        "input",
        function () {

            const value =
                this.value
                    .toLowerCase()
                    .trim();

            if (!value) {

                renderCountryList(
                    countries
                );

                return;
            }

            const filtered =
                countries.filter(
                    country => {

                        const names = [
                            country.name?.common,
                            country.name?.official,
                            country.translations?.por?.common,
                            country.translations?.spa?.common,
                            country.translations?.eng?.common
                        ];

                        return names.some(
                            name =>
                                name &&
                                name
                                    .toLowerCase()
                                    .includes(value)
                        );
                    }
                );

            renderCountryList(
                filtered
            );
        }
    );


/* =====================================================
   ALEATÓRIO
===================================================== */

document
    .getElementById("random")
    .addEventListener(
        "click",
        () => {

            if (!countries.length) {
                return;
            }

            const country =
                countries[
                    Math.floor(
                        Math.random() *
                        countries.length
                    )
                ];

            showCountry(country);
        }
    );


/* =====================================================
   MOSTRAR PAÍS
===================================================== */

function showCountry(country) {

    if (!country) {
        return;
    }

    selectedCountry =
        country;

    const t =
        translations[currentLanguage];

    const name =
        getCountryName(country);

    const official =
        country.name?.official ||
        t.unknown;

    const capital =
        country.capital?.length
            ? country.capital.join(", ")
            : t.unknown;

    const languages =
        country.languages
            ? Object.values(
                country.languages
            ).join(", ")
            : t.unknown;

    let currency =
        t.unknown;

    if (country.currencies) {

        currency =
            Object.entries(
                country.currencies
            )
            .map(
                ([code, data]) => {

                    const symbol =
                        data.symbol
                            ? ` ${data.symbol}`
                            : "";

                    return `
                        ${data.name}
                        (${code}${symbol})
                    `;
                }
            )
            .join(", ");
    }

    const locale =
        currentLanguage === "pt"
            ? "pt-BR"
            : currentLanguage === "es"
                ? "es-ES"
                : "en-US";

    const population =
        typeof country.population ===
        "number"
            ? country.population
                .toLocaleString(locale)
            : t.unknown;

    const flag =
        country.flags?.svg ||
        country.flags?.png ||
        "";


    document.getElementById(
        "info"
    ).innerHTML = `

        <div class="countryTop">

            <img
                class="flag"
                src="${flag}"
                alt="${escapeHTML(name)}"
            >

            <h2 class="countryName">
                ${escapeHTML(name)}
            </h2>

            <div class="official">
                <strong>
                    ${t.official}:
                </strong>

                ${escapeHTML(official)}
            </div>

        </div>


        <div class="stats">

            ${createStat(
                "👥",
                t.population,
                population
            )}

            ${createStat(
                "🏛️",
                t.capital,
                capital
            )}

            ${createStat(
                "🗣️",
                t.languages,
                languages
            )}

            ${createStat(
                "💰",
                t.currency,
                currency
            )}

        </div>
    `;

    highlightMapCountry(
        country.cca3
    );
}


/* =====================================================
   CRIA ESTATÍSTICA
===================================================== */

function createStat(
    icon,
    label,
    value
) {

    return `

        <div class="stat">

            <div class="statIcon">
                ${icon}
            </div>

            <div>

                <div class="statLabel">
                    ${escapeHTML(label)}
                </div>

                <div class="statValue">
                    ${escapeHTML(value)}
                </div>

            </div>

        </div>
    `;
}


/* =====================================================
   MAPA
===================================================== */

async function loadMap() {

    try {

        /*
            Primeiro carrega a biblioteca
            TopoJSON.
        */

        if (!window.topojson) {

            await loadScript(
                "https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"
            );
        }


        /*
            Depois carrega o mapa.
        */

        const response =
            await fetch(
                "https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json"
            );

        if (!response.ok) {
            throw new Error(
                "Map HTTP " +
                response.status
            );
        }

        const topology =
            await response.json();

        drawMap(topology);

    } catch (error) {

        console.error(
            "Erro no mapa:",
            error
        );
    }
}


/* =====================================================
   CARREGAR SCRIPT
===================================================== */

function loadScript(src) {

    return new Promise(
        (resolve, reject) => {

            const script =
                document.createElement(
                    "script"
                );

            script.src = src;

            script.onload =
                resolve;

            script.onerror =
                reject;

            document.head.appendChild(
                script
            );
        }
    );
}


/* =====================================================
   DESENHAR MAPA
===================================================== */

function drawMap(topology) {

    const svg =
        document.getElementById(
            "worldMap"
        );

    svg.innerHTML = "";

    const geo =
        topojson.feature(
            topology,
            topology.objects.countries
        );


    /*
        Projeção simples:
        longitude → X
        latitude → Y
    */

    function project(point) {

        const longitude =
            point[0];

        const latitude =
            point[1];

        const x =
            (longitude + 180) /
            360 *
            1000;

        const y =
            (90 - latitude) /
            180 *
            500;

        return [x, y];
    }


    function ringToPath(ring) {

        return ring
            .map(
                (point, index) => {

                    const [
                        x,
                        y
                    ] =
                        project(point);

                    return (
                        index === 0
                            ? `M ${x} ${y}`
                            : `L ${x} ${y}`
                    );
                }
            )
            .join(" ")
            + " Z";
    }


    function geometryToPath(
        geometry
    ) {

        if (
            geometry.type ===
            "Polygon"
        ) {

            return geometry.coordinates
                .map(ringToPath)
                .join(" ");

        }


        if (
            geometry.type ===
            "MultiPolygon"
        ) {

            return geometry.coordinates
                .map(
                    polygon =>
                        polygon
                            .map(
                                ringToPath
                            )
                            .join(" ")
                )
                .join(" ");
        }

        return "";
    }


    geo.features.forEach(
        feature => {

            const path =
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "path"
                );

            path.setAttribute(
                "d",
                geometryToPath(
                    feature.geometry
                )
            );

            path.classList.add(
                "country"
            );


            /*
                ID do world-atlas é numérico.
            */

            const numericId =
                String(feature.id)
                    .padStart(3, "0");


            /*
                Agora procuramos
                pelo ccn3.
            */

            const country =
                countries.find(
                    item =>
                        item.ccn3 ===
                        numericId
                );


            if (country) {

                path.dataset.code =
                    country.cca3;

                path.setAttribute(
                    "aria-label",
                    getCountryName(country)
                );

                path.addEventListener(
                    "click",
                    () =>
                        showCountry(
                            country
                        )
                );
            }


            svg.appendChild(
                path
            );
        }
    );


    /*
        Caso já tenha país selecionado.
    */

    if (selectedCountry) {

        highlightMapCountry(
            selectedCountry.cca3
        );
    }
}


/* =====================================================
   DESTACAR PAÍS
===================================================== */

function highlightMapCountry(
    code
) {

    document
        .querySelectorAll(
            ".country.selected"
        )
        .forEach(
            element =>
                element.classList.remove(
                    "selected"
                )
        );


    if (!code) {
        return;
    }


    const element =
        document.querySelector(
            `.country[data-code="${code}"]`
        );


    if (element) {

        element.classList.add(
            "selected"
        );
    }
}


/* =====================================================
   TROCA DE IDIOMA
===================================================== */

document
    .getElementById("language")
    .addEventListener(
        "change",
        function () {

            currentLanguage =
                this.value;

            applyLanguage();

            renderCountryList(
                countries
            );

            if (selectedCountry) {

                showCountry(
                    selectedCountry
                );
            }
        }
    );


/* =====================================================
   INICIALIZAÇÃO
===================================================== */

applyLanguage();

loadCountries();

</script>
