<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notas Autoadesivas</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    --bg: #f3f3f3;
    --panel: #ffffff;
    --text: #202020;
    --border: #d8d8d8;
    --accent: #2563eb;
    --shadow: 0 4px 18px rgba(0,0,0,.15);
}

* {
    scrollbar-width: thin;
}

body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
}

/* APP */

.app {
    height: 100vh;
    display: flex;
}

/* SIDEBAR */

.sidebar {
    width: 280px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    z-index: 1000;
}

.header {
    padding: 18px;
    border-bottom: 1px solid var(--border);
}

.logo {
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 14px;
}

.new-note {
    width: 100%;
    border: none;
    background: var(--accent);
    color: white;
    border-radius: 7px;
    padding: 11px;
    cursor: pointer;
    font-size: 15px;
}

.new-note:hover {
    filter: brightness(.92);
}

.search {
    padding: 12px;
    border-bottom: 1px solid var(--border);
}

.search input {
    width: 100%;
    padding: 9px 11px;
    border: 1px solid var(--border);
    border-radius: 6px;
    outline: none;
    background: var(--bg);
    color: var(--text);
}

.note-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
}

.note-item {
    padding: 11px;
    border-radius: 7px;
    cursor: pointer;
    margin-bottom: 5px;
    border: 1px solid transparent;
}

.note-item:hover {
    background: rgba(0,0,0,.05);
}

.note-item.active {
    border-color: var(--accent);
    background: rgba(37,99,235,.08);
}

.note-item-title {
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.note-item-preview {
    font-size: 12px;
    opacity: .65;
    margin-top: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.empty-list {
    text-align: center;
    opacity: .55;
    padding: 30px 10px;
    font-size: 14px;
}

/* WORKSPACE */

.workspace {
    flex: 1;
    position: relative;
    overflow: hidden;
}

/* TOPBAR */

.topbar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 58px;
    background: rgba(255,255,255,.9);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 15px;
    z-index: 900;
}

.topbar-title {
    font-size: 16px;
    font-weight: 600;
}

.controls {
    display: flex;
    gap: 7px;
}

.icon-btn {
    border: 1px solid var(--border);
    background: var(--panel);
    border-radius: 6px;
    width: 36px;
    height: 36px;
    cursor: pointer;
    font-size: 16px;
}

.icon-btn:hover {
    background: var(--bg);
}

/* DESKTOP */

.desktop {
    position: absolute;
    inset: 58px 0 0 0;
    overflow: hidden;
}

/* NOTE */

.note {
    position: absolute;
    width: 280px;
    min-width: 190px;
    min-height: 190px;
    max-width: 600px;
    max-height: 700px;
    box-shadow: var(--shadow);
    border-radius: 4px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    resize: both;
}

.note.yellow {
    background: #fff59d;
}

.note.blue {
    background: #a8d8ff;
}

.note.green {
    background: #b8f2b0;
}

.note.pink {
    background: #ffb9d0;
}

.note.purple {
    background: #d4b5ff;
}

.note.orange {
    background: #ffc98b;
}

.note-header {
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 7px 0 11px;
    cursor: move;
    user-select: none;
}

.note-color {
    display: flex;
    gap: 4px;
}

.color {
    width: 17px;
    height: 17px;
    border-radius: 50%;
    border: 1px solid rgba(0,0,0,.15);
    cursor: pointer;
}

.color.yellow { background:#fff59d; }
.color.blue { background:#a8d8ff; }
.color.green { background:#b8f2b0; }
.color.pink { background:#ffb9d0; }
.color.purple { background:#d4b5ff; }
.color.orange { background:#ffc98b; }

.note-actions {
    display: flex;
    gap: 3px;
}

.note-action {
    border: none;
    background: transparent;
    width: 27px;
    height: 27px;
    cursor: pointer;
    border-radius: 4px;
}

.note-action:hover {
    background: rgba(0,0,0,.1);
}

.note-content {
    flex: 1;
    padding: 5px 12px 12px;
    overflow-y: auto;
}

.note-title {
    width: 100%;
    border: none;
    outline: none;
    background: transparent;
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 8px;
    color: #222;
}

.note-text {
    width: 100%;
    min-height: 100px;
    border: none;
    outline: none;
    resize: none;
    background: transparent;
    font-family: inherit;
    font-size: 15px;
    line-height: 1.45;
    color: #222;
}

.note-text a {
    color: inherit;
}

/* TOOLBAR */

.editor-toolbar {
    display: flex;
    gap: 4px;
    margin-bottom: 5px;
}

.format-btn {
    border: none;
    background: rgba(255,255,255,.35);
    border-radius: 4px;
    width: 28px;
    height: 27px;
    cursor: pointer;
    font-weight: bold;
}

.format-btn:hover {
    background: rgba(0,0,0,.1);
}

/* EMPTY */

.welcome {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
}

.welcome-box {
    text-align: center;
    opacity: .5;
}

.welcome-box .big {
    font-size: 55px;
}

.welcome-box h2 {
    margin: 8px 0;
}

.welcome-box p {
    margin: 0;
}

/* LANGUAGE */

.language-menu {
    position: absolute;
    top: 53px;
    right: 10px;
    background: var(--panel);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    border-radius: 7px;
    overflow: hidden;
    display: none;
    z-index: 2000;
}

.language-menu button {
    border: none;
    background: transparent;
    display: block;
    width: 150px;
    text-align: left;
    padding: 10px 13px;
    cursor: pointer;
    color: var(--text);
}

.language-menu button:hover {
    background: var(--bg);
}

/* MOBILE */

@media(max-width: 700px) {
    .sidebar {
        width: 220px;
    }

    .note {
        width: 250px;
    }
}

@media(max-width: 520px) {
    .sidebar {
        position: absolute;
        left: -280px;
        top: 0;
        bottom: 0;
        transition: .2s;
        box-shadow: var(--shadow);
    }

    .sidebar.open {
        left: 0;
    }

    .mobile-menu {
        display: block !important;
    }
}

.mobile-menu {
    display: none;
}
</style>
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->

    <aside class="sidebar" id="sidebar">

        <div class="header">
            <div class="logo" data-i18n="appName">
                Notas Autoadesivas
            </div>

            <button class="new-note" id="newNote">
                + <span data-i18n="newNote">Nova nota</span>
            </button>
        </div>

        <div class="search">
            <input
                id="search"
                type="text"
                data-placeholder="search"
                placeholder="Pesquisar notas..."
            >
        </div>

        <div class="note-list" id="noteList"></div>

    </aside>

    <!-- WORKSPACE -->

    <main class="workspace">

        <header class="topbar">

            <div style="display:flex;align-items:center;gap:8px;">

                <button
                    class="icon-btn mobile-menu"
                    id="mobileMenu"
                    title="Menu"
                >
                    ☰
                </button>

                <div
                    class="topbar-title"
                    data-i18n="desktopTitle"
                >
                    Área de trabalho
                </div>

            </div>

            <div class="controls">

                <button
                    class="icon-btn"
                    id="languageButton"
                    title="Idioma"
                >
                    🌐
                </button>

                <button
                    class="icon-btn"
                    id="themeButton"
                    title="Tema"
                >
                    ◐
                </button>

            </div>

            <div class="language-menu" id="languageMenu">

                <button data-language="pt">
                    🇧🇷 Português
                </button>

                <button data-language="es">
                    🇪🇸 Español
                </button>

                <button data-language="en">
                    🇺🇸 English
                </button>

            </div>

        </header>

        <section class="desktop" id="desktop">

            <div class="welcome" id="welcome">

                <div class="welcome-box">

                    <div class="big">📝</div>

                    <h2 data-i18n="welcomeTitle">
                        Suas notas
                    </h2>

                    <p data-i18n="welcomeText">
                        Crie uma nota para começar.
                    </p>

                </div>

            </div>

        </section>

    </main>

</div>

<script>
/* =========================================================
   TRADUÇÕES
========================================================= */

const translations = {

    pt: {
        appName: "SuperNotes: Notas Autoadesivas",
        newNote: "Nova nota",
        search: "Pesquisar notas...",
        desktopTitle: "Área de trabalho",
        welcomeTitle: "Suas notas",
        welcomeText: "Crie uma nota para começar.",
        untitled: "Sem título",
        delete: "Excluir",
        bold: "Negrito",
        italic: "Itálico",
        list: "Lista",
        noteTitle: "Título",
        noteText: "Escreva sua nota...",
        confirmDelete: "Deseja excluir esta nota?",
        noNotes: "Nenhuma nota encontrada.",
        menu: "Menu"
    },

    es: {
        appName: "SuperNotes: Notas adhesivas",
        newNote: "Nueva nota",
        search: "Buscar notas...",
        desktopTitle: "Área de trabajo",
        welcomeTitle: "Tus notas",
        welcomeText: "Crea una nota para comenzar.",
        untitled: "Sin título",
        delete: "Eliminar",
        bold: "Negrita",
        italic: "Cursiva",
        list: "Lista",
        noteTitle: "Título",
        noteText: "Escribe tu nota...",
        confirmDelete: "¿Quieres eliminar esta nota?",
        noNotes: "No se encontraron notas.",
        menu: "Menú"
    },

    en: {
        appName: "SuperNotes: Sticky Notes",
        newNote: "New note",
        search: "Search notes...",
        desktopTitle: "Workspace",
        welcomeTitle: "Your notes",
        welcomeText: "Create a note to get started.",
        untitled: "Untitled",
        delete: "Delete",
        bold: "Bold",
        italic: "Italic",
        list: "List",
        noteTitle: "Title",
        noteText: "Write your note...",
        confirmDelete: "Do you want to delete this note?",
        noNotes: "No notes found.",
        menu: "Menu"
    }

};


/* =========================================================
   IDIOMA AUTOMÁTICO
========================================================= */

function detectLanguage() {

    const language = navigator.language.toLowerCase();

    if (language.startsWith("pt")) {
        return "pt";
    }

    if (language.startsWith("es")) {
        return "es";
    }

    if (language.startsWith("en")) {
        return "en";
    }

    return "en";
}

let currentLanguage =
    localStorage.getItem("stickyLanguage") || detectLanguage();


function t(key) {

    return translations[currentLanguage][key]
        || translations.en[key]
        || key;
}


/* =========================================================
   APLICAR TRADUÇÃO
========================================================= */

function updateLanguage() {

    document.documentElement.lang =
        currentLanguage === "pt"
            ? "pt-BR"
            : currentLanguage === "es"
                ? "es"
                : "en";

    document.querySelectorAll("[data-i18n]").forEach(element => {

        const key = element.dataset.i18n;

        element.textContent = t(key);

    });

    document.querySelectorAll("[data-placeholder]").forEach(element => {

        element.placeholder =
            t(element.dataset.placeholder);

    });

    renderList();
    updateNoteTexts();

    localStorage.setItem(
        "stickyLanguage",
        currentLanguage
    );
}


/* =========================================================
   DADOS
========================================================= */

let notes =
    JSON.parse(
        localStorage.getItem("stickyNotes")
    ) || [];

let activeNote = null;


/* =========================================================
   SALVAR
========================================================= */

function saveNotes() {

    localStorage.setItem(
        "stickyNotes",
        JSON.stringify(notes)
    );

}


/* =========================================================
   ID
========================================================= */

function createId() {

    return Date.now().toString()
        + Math.random().toString(16).slice(2);

}


/* =========================================================
   NOVA NOTA
========================================================= */

document
.getElementById("newNote")
.addEventListener("click", () => {

    const note = {

        id: createId(),

        title: "",

        text: "",

        color: "yellow",

        x: 40 + Math.random() * 100,

        y: 40 + Math.random() * 80

    };

    notes.push(note);

    saveNotes();

    createNoteElement(note);

    activeNote = note.id;

    renderList();

    document
        .getElementById("welcome")
        .style.display = "none";

});


/* =========================================================
   CRIAR NOTA
========================================================= */

function createNoteElement(note) {

    const desktop =
        document.getElementById("desktop");

    const element =
        document.createElement("div");

    element.className =
        "note " + note.color;

    element.dataset.id = note.id;

    element.style.left =
        note.x + "px";

    element.style.top =
        note.y + "px";


    element.innerHTML = `

        <div class="note-header">

            <div class="note-color">

                <button class="color yellow"
                    data-color="yellow"></button>

                <button class="color blue"
                    data-color="blue"></button>

                <button class="color green"
                    data-color="green"></button>

                <button class="color pink"
                    data-color="pink"></button>

                <button class="color purple"
                    data-color="purple"></button>

                <button class="color orange"
                    data-color="orange"></button>

            </div>

            <div class="note-actions">

                <button
                    class="note-action bold-btn"
                    title="${t("bold")}"
                >
                    B
                </button>

                <button
                    class="note-action italic-btn"
                    title="${t("italic")}"
                >
                    I
                </button>

                <button
                    class="note-action list-btn"
                    title="${t("list")}"
                >
                    ☷
                </button>

                <button
                    class="note-action delete-btn"
                    title="${t("delete")}"
                >
                    🗑
                </button>

            </div>

        </div>

        <div class="note-content">

            <input
                class="note-title"
                type="text"
                placeholder="${t("noteTitle")}"
                value="${escapeHTML(note.title)}"
            >

            <div class="editor-toolbar"></div>

            <textarea
                class="note-text"
                placeholder="${t("noteText")}"
            >${escapeHTML(note.text)}</textarea>

        </div>
    `;


    desktop.appendChild(element);


    /* TÍTULO */

    const title =
        element.querySelector(".note-title");

    title.addEventListener("input", () => {

        note.title = title.value;

        saveNotes();

        renderList();

    });


    /* TEXTO */

    const text =
        element.querySelector(".note-text");

    text.addEventListener("input", () => {

        note.text = text.value;

        saveNotes();

        renderList();

    });


    /* CORES */

    element
        .querySelectorAll(".color")
        .forEach(button => {

            button.addEventListener("click", e => {

                e.stopPropagation();

                const color =
                    button.dataset.color;

                element.className =
                    "note " + color;

                element.dataset.id =
                    note.id;

                note.color = color;

                saveNotes();

            });

        });


    /* EXCLUIR */

    element
        .querySelector(".delete-btn")
        .addEventListener("click", e => {

            e.stopPropagation();

            if (!confirm(t("confirmDelete"))) {
                return;
            }

            notes =
                notes.filter(
                    n => n.id !== note.id
                );

            saveNotes();

            element.remove();

            renderList();

            if (notes.length === 0) {

                document
                    .getElementById("welcome")
                    .style.display = "flex";

            }

        });


    /* NEGRITO */

    element
        .querySelector(".bold-btn")
        .addEventListener("click", () => {

            formatText(text, "**");

        });


    /* ITÁLICO */

    element
        .querySelector(".italic-btn")
        .addEventListener("click", () => {

            formatText(text, "*");

        });


    /* LISTA */

    element
        .querySelector(".list-btn")
        .addEventListener("click", () => {

            const start =
                text.selectionStart;

            const before =
                text.value.substring(0, start);

            const lineStart =
                before.lastIndexOf("\n") + 1;

            text.value =
                text.value.substring(0, lineStart)
                + "• "
                + text.value.substring(lineStart);

            note.text = text.value;

            saveNotes();

        });


    /* ARRASTAR */

    enableDragging(element, note);


    return element;

}


/* =========================================================
   FORMATAÇÃO
========================================================= */

function formatText(textarea, marker) {

    const start =
        textarea.selectionStart;

    const end =
        textarea.selectionEnd;

    if (start === end) return;

    const selected =
        textarea.value.substring(start, end);

    textarea.value =
        textarea.value.substring(0, start)
        + marker
        + selected
        + marker
        + textarea.value.substring(end);

    textarea.dispatchEvent(
        new Event("input")
    );

}


/* =========================================================
   ARRASTAR NOTA
========================================================= */

function enableDragging(element, note) {

    const header =
        element.querySelector(".note-header");

    let dragging = false;

    let offsetX = 0;
    let offsetY = 0;


    header.addEventListener("pointerdown", e => {

        if (
            e.target.closest("button")
        ) {
            return;
        }

        dragging = true;

        const rect =
            element.getBoundingClientRect();

        offsetX =
            e.clientX - rect.left;

        offsetY =
            e.clientY - rect.top;

        header.setPointerCapture(
            e.pointerId
        );

    });


    header.addEventListener("pointermove", e => {

        if (!dragging) return;

        const desktop =
            document.getElementById("desktop");

        const rect =
            desktop.getBoundingClientRect();

        let x =
            e.clientX -
            rect.left -
            offsetX;

        let y =
            e.clientY -
            rect.top -
            offsetY;


        x = Math.max(
            0,
            Math.min(
                x,
                desktop.clientWidth -
                element.offsetWidth
            )
        );


        y = Math.max(
            0,
            Math.min(
                y,
                desktop.clientHeight -
                element.offsetHeight
            )
        );


        element.style.left =
            x + "px";

        element.style.top =
            y + "px";

        note.x = x;
        note.y = y;

    });


    header.addEventListener("pointerup", e => {

        dragging = false;

        saveNotes();

    });

}


/* =========================================================
   LISTA DE NOTAS
========================================================= */

function renderList() {

    const list =
        document.getElementById("noteList");

    const search =
        document
        .getElementById("search")
        .value
        .toLowerCase();

    list.innerHTML = "";

    const filtered =
        notes.filter(note => {

            return (
                note.title.toLowerCase()
                .includes(search)
                ||
                note.text.toLowerCase()
                .includes(search)
            );

        });


    if (filtered.length === 0) {

        list.innerHTML =
            `<div class="empty-list">
                ${t("noNotes")}
            </div>`;

        return;

    }


    filtered.forEach(note => {

        const item =
            document.createElement("div");

        item.className =
            "note-item"
            + (
                note.id === activeNote
                    ? " active"
                    : ""
            );


        const title =
            note.title.trim()
                || t("untitled");


        const preview =
            note.text
                .replace(/\n/g, " ")
                .trim();


        item.innerHTML = `

            <div class="note-item-title">
                ${escapeHTML(title)}
            </div>

            <div class="note-item-preview">
                ${escapeHTML(preview)}
            </div>

        `;


        item.addEventListener(
            "click",
            () => {

                const element =
                    document.querySelector(
                        `.note[data-id="${note.id}"]`
                    );

                if (!element) return;

                activeNote = note.id;

                element.scrollIntoView({
                    behavior: "smooth",
                    block: "center",
                    inline: "center"
                });

                renderList();

            }
        );


        list.appendChild(item);

    });

}


/* =========================================================
   PESQUISA
========================================================= */

document
.getElementById("search")
.addEventListener(
    "input",
    renderList
);


/* =========================================================
   CARREGAR NOTAS
========================================================= */

function loadNotes() {

    notes.forEach(note => {

        createNoteElement(note);

    });

    if (notes.length > 0) {

        document
            .getElementById("welcome")
            .style.display = "none";

    }

    renderList();

}


/* =========================================================
   ATUALIZAR TEXTOS DAS NOTAS
========================================================= */

function updateNoteTexts() {

    document
        .querySelectorAll(".note")
        .forEach(element => {

            element
                .querySelector(".note-title")
                .placeholder =
                    t("noteTitle");

            element
                .querySelector(".note-text")
                .placeholder =
                    t("noteText");

            element
                .querySelector(".bold-btn")
                .title =
                    t("bold");

            element
                .querySelector(".italic-btn")
                .title =
                    t("italic");

            element
                .querySelector(".list-btn")
                .title =
                    t("list");

            element
                .querySelector(".delete-btn")
                .title =
                    t("delete");

        });

}


/* =========================================================
   IDIOMA
========================================================= */

document
.getElementById("languageButton")
.addEventListener("click", e => {

    e.stopPropagation();

    const menu =
        document.getElementById("languageMenu");

    menu.style.display =
        menu.style.display === "block"
            ? "none"
            : "block";

});


document
.querySelectorAll("[data-language]")
.forEach(button => {

    button.addEventListener("click", () => {

        currentLanguage =
            button.dataset.language;

        updateLanguage();

        document
            .getElementById("languageMenu")
            .style.display = "none";

    });

});


document.addEventListener("click", () => {

    document
        .getElementById("languageMenu")
        .style.display = "none";

});


/* =========================================================
   TEMA
========================================================= */

let dark =
    localStorage.getItem("stickyDark")
    === "true";


function updateTheme() {

    if (dark) {

        document.documentElement.style.setProperty(
            "--bg",
            "#181818"
        );

        document.documentElement.style.setProperty(
            "--panel",
            "#242424"
        );

        document.documentElement.style.setProperty(
            "--text",
            "#eeeeee"
        );

        document.documentElement.style.setProperty(
            "--border",
            "#404040"
        );

    } else {

        document.documentElement.style.setProperty(
            "--bg",
            "#f3f3f3"
        );

        document.documentElement.style.setProperty(
            "--panel",
            "#ffffff"
        );

        document.documentElement.style.setProperty(
            "--text",
            "#202020"
        );

        document.documentElement.style.setProperty(
            "--border",
            "#d8d8d8"
        );

    }

    localStorage.setItem(
        "stickyDark",
        dark
    );

}


document
.getElementById("themeButton")
.addEventListener("click", () => {

    dark = !dark;

    updateTheme();

});


/* =========================================================
   MENU MOBILE
========================================================= */

document
.getElementById("mobileMenu")
.addEventListener("click", () => {

    document
        .getElementById("sidebar")
        .classList.toggle("open");

});


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================================================
   ATALHOS
========================================================= */

document.addEventListener(
    "keydown",
    e => {

        if (
            (e.ctrlKey || e.metaKey)
            &&
            e.key.toLowerCase() === "n"
        ) {

            e.preventDefault();

            document
                .getElementById("newNote")
                .click();

        }

    }
);


/* =========================================================
   INICIALIZAÇÃO
========================================================= */

updateTheme();

updateLanguage();

loadNotes();

</script>
